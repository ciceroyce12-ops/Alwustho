<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Al Wustho Technologies</title>
    <style>
        /* Base Reset & Styling */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { height: 100vh; overflow: hidden; display: flex; align-items: center; justify-content: center; color: white; }

        /* Video Background Wrapper */
        .video-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
        }

        .video-background iframe {
            width: 100vw;
            height: 56.25vw; /* 16:9 Aspect Ratio */
            min-height: 100vh;
            min-width: 177.77vh;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none; /* Prevents clicking the video */
        }

        /* Overlay Content */
        .content {
            background: rgba(0, 50, 100, 0.7); /* Deep Blue with opacity */
            padding: 3rem;
            border-radius: 20px;
            text-align: center;
            border: 2px solid #FFA500; /* Orange Border */
            max-width: 80%;
        }

        h1 { color: #FFFFFF; margin-bottom: 1rem; font-size: 2.5rem; }
        p { color: #E0E0E0; margin-bottom: 2rem; font-size: 1.2rem; }

        /* WhatsApp Button */
        .wa-button {
            display: inline-block;
            background-color: #25D366; /* WhatsApp Green */
            color: white;
            padding: 15px 30px;
            text-decoration: none;
            border-radius: 50px;
            font-weight: bold;
            font-size: 1.1rem;
            transition: transform 0.2s, background 0.3s;
            border: none;
        }

        .wa-button:hover {
            transform: scale(1.05);
            background-color: #128C7E;
        }

        /* Responsive adjustments */
        @media (max-width: 600px) {
            h1 { font-size: 1.8rem; }
            .content { padding: 1.5rem; }
        }
    </style>
</head>
<body>

    <!-- Background Video -->
    <div class="video-background">
        <iframe 
            src="https://www.youtube.com/embed/PX4DT_A9UVU?autoplay=1&mute=1&loop=1&playlist=PX4DT_A9UVU&controls=0&showinfo=0&modestbranding=1" 
            frameborder="0" 
            allow="autoplay; encrypted-media" 
            allowfullscreen>
        </iframe>
    </div>

    <!-- Main Content -->
    <div class="content">
        <h1>Al Wustho Technologies</h1>
        <p>Solusi Teknologi Digital Terpercaya</p>
        <a href="https://wa.me/6285188139658" class="wa-button" target="_blank">
            Klik disini untuk konsultasi
        </a>
    </div>

</body>
</html>
